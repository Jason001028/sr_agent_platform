# sr_agent_platform 前端静态托管 + 盘阵场景 + 平台 API（阶段2/4/5 · 离线交付）
# ------------------------------------------------------------------
# 阶段4：浏览器不再读盘阵原始 TIF —— 场景由后端 FastAPI 懒生成「稀疏采样 + 直方图均衡
# 拉伸、各边 ÷2…÷32 可选（默认 ÷4）」的 JPG（09-19 烘焙规则 v3，档位进规则戳；v2 是固定的
# 各边 1/2，更早为 8192 长边 + 2% 线性），nginx 把场景根
# 整块 alias 成 /disk-array/ 静态直出；后端路径白名单
# 是第二层保险（部署时按实际盘阵挂载点收紧，见 deploy/README.md §阶段4）。
# 阶段5：平台 API（聊天 SSE / 共享队列 REST+SSE / 掩码烘焙）全走 /api/ 反代——已
# proxy_buffering off + 清 Connection（SSE 逐帧透传，普通 JSON 不受影响），
# proxy_read_timeout 提到 3600s（SSE 长连接 + 懒生成预览首访都覆盖）。
# 契约见 docs/planning/api-contract.md §6。
# 2026-09-23/24 修一处反代回归：/api/ 下那个只加 Cache-Control 的嵌套 location 漏了
#   proxy_pass，嵌套块不继承它 ⇒ 那一条 URL 由 nginx 自己回 404 HTML。前端把这种非 JSON
#   的 404 当成「盘阵上文件已被清除」。**在 /api/ 下再套 location 时，proxy_pass 必须重写
#   一遍**，且落盘前按 deploy/README.md §四 的 /preview 一条自查（content_type 应为
#   application/json，不是 text/html）。
# 2026-09-17 盘阵任意场景目录（POST /api/scenes/resolve）：本文件**不需要改**。
#   手工场景的预览走后端 GET /api/scenes/{id}/preview 直接回 JPEG 字节，与库内场景
#   同一条 /api/ 反代；它的 <源 stem>_preview.jpg 缓存在源同目录，但那条静态 URL 不在
#   /disk-array/ 之下（那个 alias 只暴露 SR_SCENES_ROOT），所以这里也不暴露它。
#   ⚠️ 不要为了让手工场景走静态 alias 而把 location /disk-array/ 的 alias 放大到整个
#      盘阵根：那等于把 /DiskArray 静态直出，后端白名单从"第二层保险"退化成唯一一层，
#      而静态 alias 本身不过后端。真需要时也只是多一条 location，别动这一条。
# 产物 dist 经 Vite base:'./' 构建，资源引用全相对，任意 root/子路径都能跑，无 CDN 依赖。
# 使用：拷到内网机 /etc/nginx/conf.d/sr-agent-platform.conf，再 nginx -t && nginx -s reload。
# 详细步骤见本包 deploy/README.md。
#
# 目标机：内网 CentOS7（nginx 来自 EPEL，默认以 nginx 用户运行，监听 80）。
# root 指到解压后的 dist 目录：/data/www/sr-agent-platform/dist
# 盘阵挂载点示例：SR_SCENES_ROOT=/data/scenes（按真机实际收紧，nginx 与后端同用此根）
server {
    listen       80;
    server_name  _;

    root   /data/www/sr-agent-platform/dist;
    index  index.html;

    # 预留大文件上限（阶段3 起文件上传走后端 API，不经 nginx；此处不拦即可）
    client_max_body_size 2g;

    # gzip：遥感页面 JS/CSS 较重，静态文本压缩明显
    gzip              on;
    gzip_min_length   1k;
    gzip_vary         on;
    gzip_types        text/css application/javascript application/json image/svg+xml;

    # 带内容 hash 的构建产物（assets/*.js|css）：长缓存 + immutable，
    # 文件名变了 URL 就变，天然突破缓存。
    location ~* /assets/.*\.(js|css)$ {
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # 阶段4：盘阵场景根整块静态暴露（原始 TIF + 后端生成的 <源同目录>/<源 stem>_preview.jpg）。
    # JPG 生成后 content 固定，短缓存 + 首次懒生成后秒开。
    location /disk-array/ {
        alias /data/scenes/;
        add_header X-Content-Type-Options nosniff;
        # 预览 JPG 与源同名目录落盘；浏览器 <img> 会带缓存，短 max-age 即可。
        # 注意：烘焙规则升级（09-17 v2、09-19 v3）时后端会**原地覆盖**同名 JPG，但这里
        # max-age=3600 会让浏览器在 1 小时内继续用旧图。09-19 起前端给这张图的 URL 拼
        # `?div=N`（档位变了查询串就变）来击穿它，所以换档**不用**硬刷新；只有「规则戳
        # 变了但档位没变」那种升级仍要硬刷新一次，或临时 reload 前把 max-age 调成 0。
        # （拖入那条的 `<stem>_preview.jpg` 不经过本 location：它只由 /api/ 反代回字节。）
        location ~* \.preview\.jpg$ {
            add_header Cache-Control "public, max-age=3600";
        }
        try_files $uri =404;
    }

    # 阶段4/5：FastAPI 反代（场景检索 + 懒生成预览 + 阶段5 聊天/队列/掩码 API）。
    # 路径白名单在后端校验，nginx 只是把 /api 交回给本机 uvicorn（systemd 见 sr-api.service）。
    # 阶段5 SSE 关键：禁缓冲 + 清 Connection（保持 HTTP/1.1 keep-alive，事件到即发）；
    # 普通 JSON 端点不受影响。proxy_read_timeout 3600s 覆盖 SSE 长连接（心跳保活）与
    # 懒生成预览首访几十秒。
    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   Connection '';
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        # /preview 生成是幂等缓存，短期浏览器缓存 OK。
        # ⚠️ 末尾的 `$` 是**故意的**：它让 /api/scenes/{id}/preview-drop（拖拽入口的
        #    预览，响应自带 Cache-Control: no-store）落到外层 location /api/，
        #    拿不到这条 max-age=300。那条 URL 按 scene id 稳定但内容会随档位变，
        #    浏览器要是缓存 5 分钟就可能端出旧档位那张图。别顺手把 `$` 去掉
        #    或改成 `preview` 前缀匹配。
        #    （location 匹配不看查询串，所以 09-19 加的 `?div=N` 不需要动这里。）
        # ⚠️ 这个嵌套 location 里**必须**再写一次 proxy_pass。nginx 只选一个 location，
        #    嵌套块不继承外层同名指令中的 proxy_pass——它是 final-location-handling 指令，
        #    子块没有自己的 proxy_pass 时，请求会落回 root 下的静态查找、由 nginx 自己回
        #    404 HTML（而不是把 /preview 交回后端）。2026-09-23 线上就是这么坏的：
        #    「老景打不开」，前端把非 JSON 的 404 当成了「盘阵上文件已被清除」。
        #    其余 proxy_*（http_version / set_header / buffering / read_timeout）是普通
        #    继承指令，不用重写。改动后按 deploy/README.md §四 的 /preview 自查一条验证。
        location ~* /api/scenes/[^/]+/preview$ {
            proxy_pass http://127.0.0.1:8000;
            add_header Cache-Control "public, max-age=300";
        }
    }

    # base:'./' 的坑：带尾斜杠的顶层路由（/viewer/）会把 ./assets 解析成 /viewer/assets → 404。
    # history 路由本身不带尾斜杠，这里把已知顶层路由的尾斜杠形式 301 规整掉再走 fallback。
    location ~ ^/(viewer|scenes|chat|queue)/$ {
        return 301 $scheme://$host/$1;
    }

    # SPA history 路由：/viewer /scenes /chat /queue 等直接刷新/直达都回退 index.html
    location / {
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;
        try_files $uri $uri/ /index.html;
    }
}
