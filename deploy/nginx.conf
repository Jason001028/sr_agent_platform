# sr_agent_platform 前端静态托管（阶段2 · 离线交付）
# ------------------------------------------------------------------
# 产物 dist 经 Vite base:'./' 构建，资源引用全相对，任意 root/子路径都能跑，无 CDN 依赖。
# 使用：拷到内网机 /etc/nginx/conf.d/sr-agent-platform.conf，再 nginx -t && nginx -s reload。
# 详细步骤见本包 deploy/README.md。
#
# 目标机：内网 CentOS7（nginx 来自 EPEL，默认以 nginx 用户运行，监听 80）。
# root 指到解压后的 dist 目录：/data/www/sr-agent-platform/dist
server {
    listen       80;
    server_name  _;

    root   /data/www/sr-agent-platform/dist;
    index  index.html;

    # 预留大文件上限（阶段3 起文件上传走后端 API，不经 nginx；此处不拦即可）
    client_max_body_size 2g;

    # gzip：遥感页面 JS/CSS 较重，静态文本压缩明显
    gzip              on;
    gzip_min_length   1k;
    gzip_vary         on;
    gzip_types        text/css application/javascript application/json image/svg+xml;

    # 带内容 hash 的构建产物（assets/*.js|css）：长缓存 + immutable，
    # 文件名变了 URL 就变，天然突破缓存。
    location ~* /assets/.*\.(js|css)$ {
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # base:'./' 的坑：带尾斜杠的顶层路由（/viewer/）会把 ./assets 解析成 /viewer/assets → 404。
    # history 路由本身不带尾斜杠，这里把已知顶层路由的尾斜杠形式 301 规整掉再走 fallback。
    location ~ ^/(viewer|chat|queue)/$ {
        return 301 $scheme://$host/$1;
    }

    # SPA history 路由：/viewer /chat /queue 等直接刷新/直达都回退 index.html
    location / {
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;
        try_files $uri $uri/ /index.html;
    }

    # 阶段5 起（chat/queue 走后端 FastAPI）再放开，当前前端纯静态不需要：
    # location /api/ {
    #     proxy_pass         http://127.0.0.1:8000;
    #     proxy_http_version 1.1;
    #     proxy_set_header   Host $host;
    #     proxy_set_header   X-Real-IP $remote_addr;
    #     proxy_read_timeout 300s;   # SR 任务长耗时
    # }
}
