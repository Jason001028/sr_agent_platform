<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" role="img" aria-label="SR 作业已受理">
  <title>SR 作业已受理</title>
  <rect x="6" y="6" width="28" height="28" rx="7" fill="#FFF9F0" stroke="#EED9BD" stroke-width="1.2"/>
  <rect x="10.5" y="11" width="18" height="18" rx="3.5" fill="#FFFEFB" stroke="#C99E6F" stroke-width="1.3"/>
  <path d="M14.5 16H24.5M14.5 20H22" stroke="#C8AD8D" stroke-width="1.35" stroke-linecap="round"/>
  <g class="receipt-tick">
    <circle cx="27.3" cy="27" r="7.2" fill="#D59149" stroke="#FFF9F0" stroke-width="2.2"/>
    <path d="M24.1 27L26.4 29.2L30.5 24.8" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <path class="receipt-beam" d="M7 8L13 8M30 32L35 32" stroke="#D59149" stroke-width="1.3" stroke-linecap="round" opacity=".45"/>
  <style>
    .receipt-tick{transform-origin:27.3px 27px;animation:srStamp .54s cubic-bezier(.18,1.34,.27,1) .08s both}
    .receipt-beam{animation:srReceiptGlow .5s ease-out .12s both}
    @keyframes srStamp{0%{transform:scale(.52);opacity:0}65%{transform:scale(1.1);opacity:1}100%{transform:scale(1);opacity:1}}
    @keyframes srReceiptGlow{0%{opacity:0}55%{opacity:.72}100%{opacity:.45}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
</svg>
