<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Batch Microfeedback · Demo</title><link rel="stylesheet" href="batch-microfeedback.css"><style>*{box-sizing:border-box}body{background:#E9EEED;color:#263B3E;font-family:system-ui,"Microsoft YaHei",sans-serif;margin:0;padding:32px}main{max-width:490px;margin:auto;background:#fff;border-radius:18px;border:1px solid #DCE5E4;padding:20px;box-shadow:0 15px 50px rgba(35,65,61,.08)}h2{margin:0;font-size:16px}.sub{font-size:12px;color:#758788;margin:7px 0 16px}.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1;padding:8px;border:1px solid #DDE5E5;border-radius:9px;background:#fff;color:#44626A;cursor:pointer;font:inherit;font-size:12px}.tabs button.on{background:#E9F1F8;border-color:#9CB9D9}.list{display:grid;gap:9px}.label{font-size:12px;color:#667A7B;margin:18px 0 8px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stats section{padding:8px;border:1px solid #E3EBE9;border-radius:10px}.stats h3{font-size:10px;font-weight:500;margin:0 0 9px}.stats b{font-size:18px}.note{font-size:11px;color:#7C8D8E;margin:18px 0 0}</style></head><body><main><h2>批量自动修复</h2><p class="sub">动效交互演示 · 不连接任何后端 / SR</p><div class="tabs" id="tabs"><button class="on" data-i="0">检测中</button><button data-i="1">掩码就绪</button><button data-i="2">提交成功</button><button data-i="3">验收通过</button></div><div class="list"><div class="sr-flow-row is-current" id="currentRow"><span class="sr-flow-icon"><img id="stageIcon" src="tile-scanning-loop.svg"></span><div class="sr-flow-main"><div class="sr-flow-name">#03 · JL1KF02B02_PMS04...</div><div class="sr-flow-state" id="stageText">正在检测影像差异</div></div><strong id="stateMark" style="font-size:10px;color:#6887B2">进行中</strong></div><div class="sr-flow-row"><span class="sr-flow-icon"><img src="item-verified-once.svg"></span><div class="sr-flow-main"><div class="sr-flow-name">#02 · JL1KF02B02_PMS02...</div><div class="sr-flow-state">此前已验收 · 历史状态不重播</div></div><span class="sr-flow-complete">✓ 已完成</span></div></div><div class="label">真实批次应从服务端快照获取三条独立进度</div><div class="stats"><section><h3>已检测</h3><b id="a">1 / 4</b><div class="sr-flow-progress" style="margin-top:8px;--sr-progress:25%"><span></span></div></section><section><h3>已提交 SR</h3><b id="b">0 / 2</b><div class="sr-flow-progress is-submission" style="margin-top:8px;--sr-progress:0%"><span></span></div></section><section><h3>已验收</h3><b id="c">0 / 2</b><div class="sr-flow-progress is-verification" style="margin-top:8px;--sr-progress:0%"><span></span></div></section></div><p class="note">展示颜色与节奏参考。点击上方四个阶段模拟单景状态事件；演示计数不是生产数据。</p></main><script>const files=['tile-scanning-loop.svg','mask-ready-once.svg','sr-received-once.svg','item-verified-once.svg'],messages=['正在检测影像差异','已找到候选区域 · 掩码就绪','SR 已受理 · Job 已建立','修复成果已通过验收'],marks=['进行中','掩码就绪','Job 已受理','✓ 已验收'];let count=0;document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));const row=document.getElementById('currentRow');row.className='sr-flow-row is-current'+(i===2?' just-received':i===3?' just-verified':'');const img=document.getElementById('stageIcon'),fresh=img.cloneNode(false);fresh.src=files[i]+'?v='+ ++count;img.replaceWith(fresh);fresh.id='stageIcon';document.getElementById('stageText').textContent=messages[i];document.getElementById('stateMark').textContent=marks[i];document.getElementById('stateMark').style.color=['#6E91D3','#8B80C8','#C99358','#249487'][i];});</script></body></html>
