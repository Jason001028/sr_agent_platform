<style>

*{box-sizing:border-box}body{margin:0;background:#eff2f0;color:var(--ink);font-family:Inter,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",system-ui,-apple-system,sans-serif;font-size:13px;-webkit-font-smoothing:antialiased}button,select{font:inherit}button{cursor:pointer}button:focus-visible,.item:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}.app{min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:38px 24px;gap:35px}.demo{width:280px;padding-top:18px}.demo .eyebrow{font-weight:750;font-size:10px;letter-spacing:.2em;color:#73887d}.demo h1{font-size:22px;line-height:1.4;letter-spacing:-.035em;margin:12px 0}.demo p{line-height:1.85;color:#63756b;margin:0 0 28px}.demo .scenario-buttons{display:flex;flex-wrap:wrap;gap:7px}.demo button{border:1px solid #d6e0d9;background:#fff;border-radius:999px;padding:8px 12px;color:#637269}.demo button.active{background:#2a5c50;border-color:#2a5c50;color:white}.demo .help{font-size:11px;border-top:1px solid #dce4de;margin-top:30px;padding-top:14px;line-height:1.9}.shell{width:400px;min-height:620px;max-width:100%;background:#fcfdfc;border:1px solid #d9e4dd;border-radius:18px;box-shadow:0 26px 70px rgba(30,59,47,.09),0 4px 12px rgba(30,59,47,.045);overflow:visible;position:relative}.top{height:58px;padding:0 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #edf1ee}.workflow{width:29px;height:29px;display:grid;place-items:center;background:#eaf3ee;color:var(--accent);border-radius:9px}.top strong{font-size:15px;letter-spacing:-.02em;font-weight:680}.top .count{font-size:10px;border-radius:8px;padding:2px 7px;background:#f1f4f2;color:#7d8c83;font-weight:650}.top .space{flex:1}.icon-btn{height:30px;width:30px;display:grid;place-items:center;border:1px solid transparent;border-radius:8px;background:transparent;color:#698077}.icon-btn:hover{background:#f0f5f2}.icon-btn svg,.workflow svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.menu-anchor{position:relative}.menu{display:none;position:absolute;z-index:5;right:0;top:36px;width:226px;padding:12px;background:white;border:1px solid #e3e9e5;border-radius:12px;box-shadow:0 16px 45px rgba(28,52,42,.14)}.menu.open{display:block}.menu-title{font-size:11px;font-weight:700;color:#9aa69f;letter-spacing:.08em;margin:2px 0 12px}.setting{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px 0;color:#3e5048}.switch{appearance:none;width:32px;height:18px;background:#d9e1dc;border-radius:100px;position:relative;flex:none;transition:background .2s}.switch:before{content:"";position:absolute;width:12px;height:12px;border-radius:50%;background:#fff;left:3px;top:3px;transition:transform .2s}.switch:checked{background:#367d6b}.switch:checked:before{transform:translateX(14px)}.menu select{width:100%;height:30px;border:1px solid var(--line);background:#f7f9f8;border-radius:6px;color:#49594f}.tiny-button{border:none;background:transparent;color:#799085;padding:6px 0}.danger{color:var(--bad);font-size:11px}.body{padding:16px}.statusline{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:650;margin-bottom:13px;min-height:17px}.statusline .dot{height:7px;width:7px;border-radius:50%;background:currentColor}.statusline.bad{color:var(--bad)}.statusline.run{color:var(--accent2)}.statusline.done{color:var(--accent)}.statusline.ready{color:#7b8881}.hero{display:flex;align-items:center;gap:15px}.hero-icon{width:65px;height:65px;border-radius:18px;background:var(--badsoft);color:var(--bad);display:grid;place-items:center;flex:none}.hero-icon svg{height:32px;width:32px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}.hero .value{font-size:31px;line-height:1.15;font-weight:710;letter-spacing:-.06em;font-variant-numeric:tabular-nums}.hero .unit{font-size:15px;font-weight:560;margin-left:5px;letter-spacing:-.02em}.hero .caption{font-size:11px;color:#829087;margin-top:6px}.run .hero-icon{background:var(--accentsoft);color:var(--accent)}.done .hero-icon{background:var(--accentsoft);color:var(--accent)}.ready .hero-icon{background:#eff4f0;color:#779487}.phase{margin-top:20px;border-top:1px solid var(--line);padding-top:17px}.phase-track{display:grid;grid-template-columns:repeat(3,1fr);gap:0}.phase-col{position:relative}.phase-col:not(:last-child):after{content:"";height:1px;background:#dbe5df;position:absolute;top:11px;left:25px;right:8px}.phase-meta{display:flex;align-items:center;gap:6px;color:#94a199;position:relative;z-index:1}.phase-symbol{width:23px;height:23px;display:grid;place-items:center;border-radius:7px;background:#eef3ef;color:#8b9d91;border:1px solid #e3ebe5}.phase-symbol svg{height:13px;width:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.phase-col:first-child .phase-symbol{background:#f8efed;color:var(--bad);border-color:#f4e1df}.phase-name{font-size:11px;font-weight:550;color:#819088;margin-top:9px}.phase-amount{font-size:12px;font-weight:700;color:#54655c;margin-top:3px;font-variant-numeric:tabular-nums}.phase-col.inactive{opacity:.62}.alert{background:#fcf7f6;border:1px solid #f3e8e5;border-radius:10px;padding:10px 12px;margin-top:18px;display:flex;gap:8px;color:#885a54;font-size:11px;line-height:1.65}.alert svg{width:14px;height:14px;flex:none;margin-top:2px}.queue-section{margin-top:21px}.section-header{display:flex;align-items:center;min-height:28px;gap:8px}.section-header b{font-size:12px;font-weight:690}.section-header .pill{font-size:10px;font-variant-numeric:tabular-nums;border-radius:30px;background:#f7efee;color:#aa665c;padding:2px 7px;font-weight:650}.section-header .spacer{flex:1}.link{border:0;background:transparent;color:var(--accent);padding:4px 0;font-size:11px;font-weight:610}.list{display:grid;gap:7px;margin-top:9px}.item{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;text-align:left;min-width:0}.item:hover{background:#fafcfb;border-color:#d2e1d7}.num{font-size:11px;color:#648176;font-weight:700;font-variant-numeric:tabular-nums}.item-content{min-width:0;flex:1}.item-name{font-size:11px;font-weight:540;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.item-detail{font-size:10px;color:#a0aaa3;margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.item .mini-status{height:22px;width:22px;border-radius:7px;display:grid;place-items:center;background:#f8eeee;color:var(--bad);font-size:13px;font-weight:bold;flex:none}.item .mini-status.good{background:#edf5f0;color:#427e6c}.item .mini-status.work{background:#eaf4ee;color:#407e6a}.item .chev{height:16px;width:16px;color:#99a69e;flex:none}.item-details{display:none;margin:-3px 5px 4px;border:1px solid #e8efea;border-top:0;padding:11px 12px;border-radius:0 0 9px 9px;background:white;font-size:11px;line-height:1.7;color:#6b7f73}.item-details.open{display:block}.secondary{margin-top:12px;width:100%;height:34px;border:1px solid #dfe7e2;background:#fff;color:#376b5d;border-radius:9px;font-size:11px;font-weight:640}.primary{margin-top:17px;width:100%;height:40px;border:none;background:var(--accent);color:white;border-radius:10px;font-weight:650;box-shadow:0 5px 12px #285b5017}.muted-copy{font-size:10px;line-height:1.7;color:#97a69c;margin-top:10px}.detailed{display:none;border-top:1px dashed #dfe8e1;padding-top:11px;margin-top:17px;font-size:10.5px;color:#84948a;line-height:2}.detailed.show{display:block}.draft-list{display:grid;gap:7px;margin-top:20px}.draft-item{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid #e4ebe6;border-radius:9px;background:white;font-size:11px}.draft-item span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.draft-item input{accent-color:var(--accent);width:14px;height:14px}.draft-count{font-size:11px;color:#87978d;margin-top:18px;display:flex;justify-content:space-between;align-items:center}.loading-spin{animation:spin 1.8s linear infinite;transform-origin:center}@keyframes spin{to{transform:rotate(360deg)}}.footer{border-top:1px solid #edf1ee;padding:16px;font-size:11px;color:#99a69d}.footer-item{height:36px;border-radius:8px;display:flex;align-items:center;gap:9px;padding:0 5px;color:#8b9b91}.footer-item svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8}.footer-item b{font-weight:580}.footer-item .spacer{flex:1}.hidden{display:none!important}#collapseTarget[hidden]{display:none!important}@media(max-width:780px){.app{flex-direction:column;align-items:center;gap:5px;padding:18px 12px}.demo{width:400px;max-width:100%;padding-top:0}.demo .help{display:none}.demo h1{font-size:18px;margin:6px 0}.demo p{font-size:11px;margin-bottom:8px}.shell{min-height:620px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
 <div class="demo"><div class="eyebrow">SR AGENT PLATFORM / UI STUDY</div><h1>Quiet Mission / 批量任务</h1><p>一个状态卡、一条阶段轨迹、一个异常入口。操作下沉，信息按需展开。</p>
  <div class="scenario-buttons"><button class="active" data-mode="failed">全部失败</button><button data-mode="running">执行中</button><button data-mode="draft">选择序列</button><button data-mode="completed">已完成</button></div>
  <div class="help">这是一份独立的视觉与交互样稿，不连接 SR 后端。<br>点击面板中的「查看全部」「···」「序列项」可以体验信息层级。<br>阶段数据均为演示数据，实际接入必须使用 Snapshot 权威字段。</div>
 </div>
 <div class="shell" aria-label="批量任务交互原型">
  <div class="top"><div class="workflow"><svg viewBox="0 0 24 24"><rect x="2" y="3" width="7" height="7" rx="1.5"/><rect x="15" y="14" width="7" height="7" rx="1.5"/><path d="M9 6.5h4a5 5 0 0 1 5 5V14M15 17.5h-4a5 5 0 0 1-5-5V10"/></svg></div><strong>自动修复</strong><div class="space"></div><div class="menu-anchor"><button class="icon-btn" id="settingsBtn" title="批次设置与更多操作" aria-label="更多操作"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.4" fill="currentColor" stroke="none"/></svg></button><div class="menu" id="settingsMenu"><div class="menu-title">显示与任务设置</div><label class="setting">显示详细统计 <input class="switch" id="showDetails" type="checkbox"></label><label class="setting">异常优先 <input class="switch" id="issuesFirst" type="checkbox" checked></label><label class="setting">自动跟随影像 <input class="switch" id="autoFollow" type="checkbox"></label><div class="menu-title" style="margin-top:19px">关联批次</div><select aria-label="关联批次"><option>当前批次 · 27 景</option><option>历史批次 · 12 景（演示）</option></select><button class="tiny-button danger" id="batchCancel" type="button">取消批次…</button></div></div><button class="icon-btn" id="collapseBtn" title="收起批量任务" aria-label="收起任务面板"><svg id="chevronIcon" viewBox="0 0 24 24"><path d="m6 14 6-6 6 6"/></svg></button></div>
  <div id="collapseTarget"><div class="body" id="mainBody"></div><div class="footer"><div class="footer-item"><svg viewBox="0 0 24 24"><path d="M4 5h16v14H4zM8 9h8m-8 4h5"/></svg><b>质检清单</b><div class="spacer"></div><span>已导入</span></div><div class="footer-item"><svg viewBox="0 0 24 24"><path d="m12 2 2.4 7.6L22 12l-7.6 2.4L12 22l-2.4-7.6L2 12l7.6-2.4z"/></svg><b>影像工具</b><div class="spacer"></div><span>⌄</span></div></div></div>
 </div>
</div>
<script>
const icons={bad:'<svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="12"/><path d="M16 9v9m0 5h.01"/></svg>',run:'<svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="12"/><path d="M16 9v8l5 3"/></svg>',done:'<svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="12"/><path d="m10 16 4.5 4.5L22 12"/></svg>',draft:'<svg viewBox="0 0 32 32"><rect x="5" y="4" width="22" height="24" rx="5"/><path d="M10 12h11m-11 6h7m-7 5h7"/></svg>'};
const picons=['<svg viewBox="0 0 16 16"><circle cx="7.5" cy="7.5" r="5.5"/><path d="m11.5 11.5 3 3"/></svg>','<svg viewBox="0 0 16 16"><path d="M3 13 12 4l1 1-9 9H3zM10 6l2 2"/></svg>','<svg viewBox="0 0 16 16"><path d="M3 8 6.3 11 13 4"/></svg>'];
let mode='failed',allOpen=false,activeItem='',draftChecked=new Set([1,2,3]);const body=document.getElementById('mainBody'),showDetails=document.getElementById('showDetails');
const modes={failed:{tone:'bad',status:'执行中止',num:27,unit:'景异常',subtitle:'共 27 景 · 成功 0',phase:['0 / 27','—','—'],alert:'检测未完成，尚无成功提交的 SR 作业。',listTitle:'异常任务',badge:'27',button:'查看全部',entries:[['01','JL1KF02B02_PMS04_20261025…','未生成 Job · 查看失败原因'],['02','JL1KF02B02_PMS04_20261026…','未生成 Job · 查看失败原因'],['03','JL1KF02B02_PMS04_20261027…','未生成 Job · 查看失败原因']]},running:{tone:'run',status:'正在执行',num:8,unit:'/ 27 景',subtitle:'8 景已验收 · 4 景 SR 在途',phase:['21 / 27','13 / 18','8 / 13'],alert:'',listTitle:'当前任务',badge:'4 在途',button:'查看全部',entries:[['09','JL1KF02B02_PMS04_20261028…','正在检测'],['12','JL1KF02B02_PMS04_20261029…','SR 运行中'],['14','JL1KF02B02_PMS04_20261030…','等待验收']]},completed:{tone:'done',status:'已完成',num:27,unit:'景完成',subtitle:'已验收 27 景 · 异常 0',phase:['27 / 27','27 / 27','27 / 27'],alert:'',listTitle:'最近结果',badge:'27',button:'查看报告',entries:[['01','JL1KF02B02_PMS04_20261025…','质量验收通过'],['02','JL1KF02B02_PMS04_20261026…','质量验收通过']]},draft:{tone:'ready',status:'等待启动',num:27,unit:'组序列',subtitle:'来自左侧查看器 · 自动核验 PAN',phase:[],alert:'',listTitle:'序列选择',badge:'可处理',button:'',entries:[]}};
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function render(){const d=modes[mode];let out=`<div class="${d.tone}"><div class="statusline ${d.tone}"><span class="dot"></span>${d.status}</div><div class="hero"><div class="hero-icon">${icons[mode==='failed'?'bad':mode==='draft'?'draft':mode]}</div><div><div class="value">${d.num}<span class="unit">${d.unit}</span></div><div class="caption">${d.subtitle}</div></div></div>`;
if(mode==='draft'){out+=`<div class="draft-count"><span>已选 <b id="selectedCounter">${draftChecked.size}</b> / 27 组</span><button class="link" id="toggleAll">${draftChecked.size===3?'取消全选':'全选'}</button></div><div class="draft-list">`;for(let i=1;i<=3;i++){out+=`<label class="draft-item"><input type="checkbox" class="draft-check" data-index="${i}" ${draftChecked.has(i)?'checked':''} /><span><b style="color:#65857a;margin-right:8px">${String(i).padStart(2,'0')}</b> JL1KF02B02_PMS04_2026102${i}…</span><small style="color:#5b8b77">✓</small></label>`;}out+=`</div><button class="primary" id="launch">开始修复 · 已选 ${draftChecked.size} 组</button><div class="muted-copy">演示只列出三条。真实实现显示所有已核验序列及禁用原因。</div>`;}
else{out+=`<div class="phase"><div class="phase-track">`;['检测','SR 修复','验收'].forEach((name,i)=>{out+=`<div class="phase-col ${d.phase[i]==='—'?'inactive':''}"><div class="phase-meta"><span class="phase-symbol">${picons[i]}</span></div><div class="phase-name">${name}</div><div class="phase-amount">${d.phase[i]}</div></div>`});out+=`</div></div>`;if(d.alert)out+=`<div class="alert"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 2 15 14H1Z"/><path d="M8 6v4m0 2h.01"/></svg><span>${d.alert}</span></div>`;out+=`<div class="queue-section"><div class="section-header"><b>${d.listTitle}</b><span class="pill">${d.badge}</span><span class="spacer"></span><button class="link" id="allButton">${allOpen?'收起':d.button} ↗</button></div><div class="list">`;const rows=allOpen?d.entries:d.entries.slice(0,1);rows.forEach((r,i)=>{out+=`<div><button class="item" data-row="${i}" aria-expanded="${activeItem===String(i)}"><span class="num">#${r[0]}</span><span class="item-content"><div class="item-name">${r[1]}</div><div class="item-detail">${r[2]}</div></span><span class="mini-status ${mode==='completed'?'good':mode==='running'?'work':''}">${mode==='completed'?'✓':mode==='running'?'↻':'!'}</span></button><div class="item-details ${activeItem===String(i)?'open':''}">${mode==='failed'?'失败详情应读取该 Item 的权威错误字段；同原因可聚合展示。':mode==='running'?'此处连接 Viewer 定位、Job 状态和受控只读 Overlay。':'查看影像结果与验收记录。'}<br><span style="color:#2c6758">定位影像 →</span></div></div>`});out+=`</div></div>`;if(mode==='completed')out+=`<button class="secondary" id="reportButton">打开完整验收报告 ↗</button>`;out+=`<div class="detailed ${showDetails.checked?'show':''}">详细统计 · 已完成  ${mode==='failed'?'0':mode==='running'?'8':'27'}  · SR 在途  ${mode==='running'?'4':'0'}<br>批次 ID · 演示批次  /  数据来源：Batch Snapshot<br>原始事件、完整队列、日志与分页建议放在调试入口。</div>`;}
out+=`</div>`;body.innerHTML=out;document.querySelectorAll('[data-row]').forEach(el=>el.addEventListener('click',()=>{activeItem=activeItem===el.dataset.row?'':el.dataset.row;render()}));document.getElementById('allButton')?.addEventListener('click',()=>{allOpen=!allOpen;render()});document.getElementById('reportButton')?.addEventListener('click',()=>alert('样稿不连接后端。实际产品应打开现有受控报告接口。'));document.getElementById('launch')?.addEventListener('click',()=>alert('交互演示：实际产品必须先冻结 Manifest、核验授权，再调用现有创建 Goal 接口。'));document.querySelectorAll('.draft-check').forEach(el=>el.addEventListener('change',()=>{const n=Number(el.dataset.index);if(el.checked)draftChecked.add(n);else draftChecked.delete(n);render()}));document.getElementById('toggleAll')?.addEventListener('click',()=>{draftChecked=new Set(draftChecked.size===3?[]:[1,2,3]);render()});}
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;allOpen=false;activeItem='';document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));render()}));
document.getElementById('settingsBtn').addEventListener('click',()=>document.getElementById('settingsMenu').classList.toggle('open'));
document.getElementById('collapseBtn').addEventListener('click',()=>{const pane=document.getElementById('collapseTarget');pane.hidden=!pane.hidden;document.getElementById('chevronIcon').innerHTML=pane.hidden?'<path d="m6 10 6 6 6-6"/>':'<path d="m6 14 6-6 6 6"/>'});showDetails.addEventListener('change',render);document.getElementById('batchCancel').addEventListener('click',()=>alert('生产环境取消批次需二次确认，且仅阻止未派发任务；已经提交的 SR 作业不会停止。'));
document.addEventListener('click',e=>{if(!e.target.closest('.menu-anchor'))document.getElementById('settingsMenu').classList.remove('open')});render();
</script>
</body></html>
