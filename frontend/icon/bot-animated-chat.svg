<svg xmlns="http://www.w3.org/2000/svg" width="32" height="28" viewBox="0 0 32 28" fill="none" role="img" aria-labelledby="bot-title bot-desc">
  <title id="bot-title">Agent 助手正在输出</title>
  <desc id="bot-desc">小 bot 原地弹动，右上角聊天气泡中的省略号循环滚动。</desc>
  <style>
    .bot-speech{transform-box:fill-box;transform-origin:center bottom;animation:bot-speech 1.15s cubic-bezier(.34,1.56,.64,1) infinite}
    .bot-body{transform-box:fill-box;transform-origin:center bottom;animation:bot-bounce 1.35s ease-in-out infinite}
    .bot-gaze{transform-box:fill-box;transform-origin:center;animation:bot-look 6.8s ease-in-out infinite}
    .bot-blink{transform-box:fill-box;transform-origin:center;animation:bot-blink 5.4s linear infinite}
    .bot-dot{transform-box:fill-box;transform-origin:center;animation:dot-wave 1.15s ease-in-out infinite}
    .bot-dot:nth-child(2){animation-delay:.13s}.bot-dot:nth-child(3){animation-delay:.26s}
    @keyframes bot-bounce{0%,100%{transform:translateY(0) scaleY(1)}18%{transform:translateY(-.45px) scaleY(1.008)}36%{transform:translateY(0) scaleY(.996)}54%{transform:translateY(-.28px) scaleY(1.004)}72%{transform:translateY(0) scaleY(1)}}
    @keyframes bot-speech{0%,100%{transform:translateY(0) rotate(0)}18%{transform:translateY(-1.1px) rotate(-2deg)}35%{transform:translateY(-.2px) rotate(1deg)}52%{transform:translateY(-.7px) rotate(-1deg)}}
    @keyframes bot-look{0%,24%,100%{transform:translateX(0)}29%,33%{transform:translateX(-1px)}61%,65%{transform:translateX(1px)}}
    @keyframes bot-blink{0%,17%,19%,69%,71%,100%{transform:scaleY(1)}18%,70%{transform:scaleY(.08)}}
    @keyframes dot-wave{0%,100%{transform:translateY(0);opacity:.45}18%{transform:translateY(-1.25px);opacity:1}36%{transform:translateY(0);opacity:.72}}
    @media(prefers-reduced-motion:reduce){.bot-speech,.bot-body,.bot-gaze,.bot-blink,.bot-dot{animation:none}}
  </style>
  <g class="bot-body" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 8V4H8"/>
    <rect width="16" height="12" x="4" y="8" rx="2.5" fill="currentColor" fill-opacity=".08"/>
    <path d="M2 14h2M20 14h2"/>
    <g class="bot-gaze"><g class="bot-blink"><path d="M9 13v2M15 13v2"/></g></g>
    <path d="M9 18h6" opacity=".7"/>
  </g>

  <g class="bot-speech" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21.2 2.5h6.1a3.2 3.2 0 0 1 3.2 3.2v2.45a3.2 3.2 0 0 1-3.2 3.2h-2.35l-2.05 2.05.3-2.05h-2a3.2 3.2 0 0 1-3.2-3.2V5.7a3.2 3.2 0 0 1 3.2-3.2Z" fill="#fff" stroke-width="1.25"/>
    <g fill="currentColor" stroke="none"><circle class="bot-dot" cx="21.8" cy="6.9" r=".85"/><circle class="bot-dot" cx="24.7" cy="6.9" r=".85"/><circle class="bot-dot" cx="27.6" cy="6.9" r=".85"/></g>
  </g>
</svg>