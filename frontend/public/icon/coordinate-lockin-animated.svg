<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">外部坐标已载入</title>
  <desc id="desc">定位角标收拢、坐标图钉轻微落位，圆环扩散后出现确认勾。动画播放一次，随后静止。</desc>
  <style>
    /* Single-shot SVG animation (800ms), no script and no external dependencies.
       Remount the SVG element / change the image key to replay. */
    .corner {
      stroke: #71A89A;
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0;
      animation: corner-settle 800ms cubic-bezier(.22,1,.36,1) 1 both;
    }
    .tl { --tx: -3px; --ty: -3px; }
    .tr { --tx: 3px; --ty: -3px; }
    .bl { --tx: -3px; --ty: 3px; }
    .br { --tx: 3px; --ty: 3px; }
    @keyframes corner-settle {
      0%   { opacity: 0; transform: translate(var(--tx),var(--ty)); }
      6%   { opacity: .62; }
      22.5%{ opacity: .62; transform: translate(0,0); }
      42%  { opacity: .38; transform: translate(0,0); }
      67%  { opacity: 0; transform: translate(0,0); }
      100% { opacity: 0; transform: translate(0,0); }
    }
    .ring {
      stroke: #42AB8E;
      stroke-width: 2.5;
      opacity: 0;
      transform-origin: 32px 29px;
      animation: ring-release 800ms ease-out 1 both;
    }
    @keyframes ring-release {
      0%, 22.5% { opacity: 0; transform: scale(.48); }
      26% { opacity: .38; transform: scale(.52); }
      48% { opacity: .28; transform: scale(.85); }
      75% { opacity: 0; transform: scale(1.15); }
      100% { opacity: 0; transform: scale(1.15); }
    }
    .pin {
      stroke: #176F62;
      stroke-width: 3.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      animation: pin-lock 800ms cubic-bezier(.22,1,.36,1) 1 both;
    }
    @keyframes pin-lock {
      0%, 22.5% { transform: translateY(-2px); }
      40% { transform: translateY(1px); }
      52.5%, 100% { transform: translateY(0); }
    }
    .center-dot {
      fill: #4F9D87;
      animation: dot-out 800ms ease-out 1 both;
    }
    @keyframes dot-out {
      0%, 48% { opacity: 1; transform: scale(1); transform-origin: 32px 28px; }
      58%, 100% { opacity: 0; transform: scale(.7); transform-origin: 32px 28px; }
    }
    .check {
      stroke: #176F62;
      stroke-width: 3.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 18;
      animation: check-in 800ms ease-out 1 both;
    }
    @keyframes check-in {
      0%, 52.5% { opacity: 0; stroke-dashoffset: 18; }
      56% { opacity: 1; }
      77.5%, 100% { opacity: 1; stroke-dashoffset: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .corner, .ring, .pin, .center-dot, .check { animation: none !important; }
      .corner, .ring, .center-dot { opacity: 0; }
      .pin, .check { opacity: 1; }
      .check { stroke-dashoffset: 0; }
    }
  </style>
  <g class="corner tl"><path d="M12 22V12H22"/></g>
  <g class="corner tr"><path d="M42 12H52V22"/></g>
  <g class="corner bl"><path d="M12 42V52H22"/></g>
  <g class="corner br"><path d="M42 52H52V42"/></g>
  <circle class="ring" cx="32" cy="29" r="19"/>
  <g class="pin">
    <path d="M32 12.5C24.1 12.5 18 18.6 18 26.6C18 36 32 50.8 32 50.8S46 36 46 26.6C46 18.6 39.9 12.5 32 12.5Z"/>
    <circle class="center-dot" cx="32" cy="27.8" r="4.2" stroke="none"/>
    <path class="check" d="m25.6 27.8 4.3 4.2 8.5-8.6"/>
  </g>
</svg>
