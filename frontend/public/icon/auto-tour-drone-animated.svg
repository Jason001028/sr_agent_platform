<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" aria-label="Animated auto-tour drone icon">
  <style>
    :root {
      color: #166C67;
    }
    .stroke {
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .body {
      transform-origin: 12px 12px;
      animation: float 2.2s cubic-bezier(.45,.05,.55,.95) infinite;
    }
    .rotor {
      stroke: currentColor;
      stroke-width: 1.6;
      stroke-linecap: round;
      opacity: .95;
      transform-box: fill-box;
      transform-origin: center;
      animation: spin .7s linear infinite;
    }
    .rotor.ccw { animation-direction: reverse; }
    .ring {
      stroke: currentColor;
      stroke-width: 1.2;
      opacity: .18;
    }
    .pulse {
      transform-box: view-box;
      transform-origin: 12px 12px;
      stroke: currentColor;
      stroke-width: 1.2;
      opacity: 0;
      stroke-dasharray: 2 3;
      animation: pulse 1.8s ease-out infinite;
    }
    .pulse.delay { animation-delay: .45s; }
    .trail {
      stroke: currentColor;
      stroke-width: 1.4;
      stroke-linecap: round;
      opacity: 0;
      animation: trail 1.3s ease-in-out infinite;
    }
    .trail.delay { animation-delay: .22s; }

    @keyframes float {
      0%,100% { transform: translateY(0px) rotate(0deg); }
      25% { transform: translateY(-0.55px) rotate(-1deg); }
      50% { transform: translateY(-1.1px) rotate(0.8deg); }
      75% { transform: translateY(-0.4px) rotate(-0.6deg); }
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0% { opacity: 0; transform: scale(.88); }
      22% { opacity: .22; }
      100% { opacity: 0; transform: scale(1.22); }
    }
    @keyframes trail {
      0%, 100% { opacity: 0; transform: translateX(0px); }
      18% { opacity: .38; }
      55% { opacity: .16; }
      100% { opacity: 0; transform: translateX(-2.2px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .body, .rotor, .pulse, .trail { animation: none !important; }
      .pulse, .trail { opacity: 0; }
    }
  </style>

  <!-- subtle navigation trail to suggest active巡航 -->
  <g aria-hidden="true">
    <path class="trail" d="M2.2 10.5h2.2" />
    <path class="trail delay" d="M1.7 13.5h2.7" />
  </g>

  <g class="body">
    <!-- expanding route pulses -->
    <circle class="pulse" cx="12" cy="12" r="8.3" />
    <circle class="pulse delay" cx="12" cy="12" r="8.3" />

    <!-- support rings for rotors -->
    <circle class="ring" cx="7" cy="7" r="1.7" />
    <circle class="ring" cx="17" cy="7" r="1.7" />
    <circle class="ring" cx="7" cy="17" r="1.7" />
    <circle class="ring" cx="17" cy="17" r="1.7" />

    <!-- original drone icon -->
    <g class="stroke">
      <path d="M10 10 7 7"/>
      <path d="m10 14-3 3"/>
      <path d="m14 10 3-3"/>
      <path d="m14 14 3 3"/>
      <path d="M14.205 4.139a4 4 0 1 1 5.439 5.863"/>
      <path d="M19.637 14a4 4 0 1 1-5.432 5.868"/>
      <path d="M4.367 10a4 4 0 1 1 5.438-5.862"/>
      <path d="M9.795 19.862a4 4 0 1 1-5.429-5.873"/>
      <rect x="10" y="8" width="4" height="8" rx="1"/>
    </g>

    <!-- spinning propeller blades -->
    <g transform="translate(7 7)"><g class="rotor">
      <path d="M-1.5 0H1.5" />
      <path d="M0-1.5V1.5" />
    </g></g>
    <g transform="translate(17 7)"><g class="rotor ccw">
      <path d="M-1.5 0H1.5" />
      <path d="M0-1.5V1.5" />
    </g></g>
    <g transform="translate(7 17)"><g class="rotor ccw">
      <path d="M-1.5 0H1.5" />
      <path d="M0-1.5V1.5" />
    </g></g>
    <g transform="translate(17 17)"><g class="rotor">
      <path d="M-1.5 0H1.5" />
      <path d="M0-1.5V1.5" />
    </g></g>
  </g>
</svg>
