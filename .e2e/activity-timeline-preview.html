<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><title>Agent Activity Timeline fixture</title>
<style>body{margin:0;background:#dfe9e4;font:13px system-ui}#preview{margin:24px auto;width:320px;max-width:calc(100vw - 24px);background:#fff;padding:16px;border-radius:12px}h1{font-size:13px;color:#48615d;font-weight:500}*{box-sizing:border-box}.fixture-control{border:0;background:none;font:11px system-ui;color:#48615d;padding:6px 0;cursor:pointer}</style>
<div id="preview"><h1>Agent · 执行轨迹</h1><div id="app"></div></div>
<script type="module">
import {createApp,h,ref,computed,reactive} from 'vue';
import {createPinia} from 'pinia';
import './src/style.css';
import Timeline from './src/components/AgentActivityTimeline.vue';
import Card from './src/components/AgentRepairPlanCard.vue';
import {projectAgentActivity} from './src/lib/agentActivity';
import {useChatStore} from './src/stores/chat';
import {useViewerStore} from './src/stores/viewer';
const query=new URLSearchParams(location.search);
document.querySelector('#preview').style.width=(query.get('width')||'320')+'px';
const rows=Array.from({length:27},(_,n)=>({item_id:'item-'+n,ordinal:n+1,name:`JXGF07D03_PMS_20260101_${n}_LONG_PRODUCTION_SCENE.tif`,scene_ref:'/fixture/scene-'+n,status:'PENDING'}));
const plan={kind:'repair_plan.v1',contract_version:'repair_plan.v1',plan_id:'plan_'+'a'.repeat(24),version:1,status:'READY',scope:'batch',workspace:{scope:'workspace'},confirmation_required:true,
 targets:{total:27,applicable:27,excluded:0,items:rows},mode:'production',strategy:{detection_method:'absdiff',detection:'现有差异检测',mask:'auto_or_existing'},execution:{allowed:true,mode:'production',reason:null}};
window.fixturePlan=plan;
window.fetch=async()=>{throw Error('Visual fixture cannot call a backend')};
const pending=ref(query.get('phase')==='running'), fail=query.has('fail');
const calls=['get_current_image_info','get_repair_workspace','read_tool_result','read_tool_result','read_skill'];
const messages=reactive([{seq:1,role:'user',content:'准备修复'}, {seq:2,role:'assistant',content:'',toolCalls:calls.map((name,n)=>({id:'t'+n,name,args:{}}))},
 ...calls.slice(0,pending.value?4:5).map((name,n)=>({seq:n+3,role:'tool',content:'',toolCallId:'t'+n,toolName:name,ok:!(fail&&n===2)}))]);
const projection=computed(()=>projectAgentActivity(messages,pending.value));
const pinia=createPinia(), app=createApp({setup(){return()=>[
 h('button',{class:'fixture-control',onClick:()=>{if(pending.value){messages.push({seq:7,role:'tool',content:'',toolCallId:'t4',toolName:calls[4],ok:true});pending.value=false}}},'模拟阶段结束'),
 ...[...projection.value.groups.values()].flat().map(group=>h(Timeline,{key:group.key,group,sessionKey:'fixture'})),
 h(Card,{data:plan})];}});
app.use(pinia);useChatStore(pinia).sessionId='fixture';
const viewer=useViewerStore(pinia);viewer.recs=rows.map((r,n)=>({id:n+1,name:r.name,sceneDir:r.scene_ref,sceneId:'fixture-'+n}));
app.mount('#app');
</script></html>
